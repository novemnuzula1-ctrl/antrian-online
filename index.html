<!DOCTYPE html>
<html>
<head>
    <title>Antrian Smart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { color: #2c3e50; font-size: 24px; }
        #nomor { font-size: 80px; color: #e74c3c; margin: 10px 0; font-weight: bold; }
        .info { font-size: 18px; color: #7f8c8d; }
        #estimasi { font-weight: bold; color: #27ae60; }
        input { padding: 10px; width: 80px; text-align: center; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; }
        input:invalid { border: 2px solid #e74c3c; background: #fce4e4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>NOMOR SEKARANG</h1>
        <div id="nomor">0</div>
        <p class="info">Silakan masukkan nomor antrian Anda:</p>
        <input type="number" id="inputNomor" min="1" placeholder="Ex: 15">
        <hr style="border: 1px dashed #eee; margin: 20px 0;">
        <p class="info">Estimasi Tunggu:<br><span id="estimasi">--</span></p>
    </div>

    <script>
        // --- KONFIGURASI FIREBASE ---
        var firebaseConfig = {
            apiKey: "AIzaSyC2s9d6HCWpxoW6LpoUeebqucINm7QslHk",
            authDomain: "antriansmart.firebaseapp.com",
            databaseURL: "https://antriansmart-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antriansmart",
        };
        firebase.initializeApp(firebaseConfig);

        var db = firebase.database();

        // 1. Mendengarkan perubahan data di Firebase
        db.ref("/panggilan_sekarang").on("value", function(snapshot) {
            var sekarang = parseInt(snapshot.val()) || 0;
            document.getElementById("nomor").innerText = sekarang;

            var inputElemen = document.getElementById("inputNomor");
            
            // KUNCI UTAMA: Mengubah batas minimal input secara dinamis (Nomor Sekarang + 1)
            // Jadi jika loket = 4, maka minimal input yang diizinkan adalah 5
            var batasMinimal = sekarang + 1;
            inputElemen.min = batasMinimal;

            var nomorSaya = parseInt(inputElemen.value) || 0;

            // Jika nomor yang sedang dimasukkan tiba-tiba tersusul oleh loket
            if (nomorSaya > 0 && nomorSaya <= sekarang) {
                inputElemen.value = ""; 
                tampilkanPesanError(sekarang);
            } else {
                hitungEstimasi(sekarang, nomorSaya);
            }
        });

        // 2. Mendengarkan input ketikan pelanggan secara real-time
        document.getElementById("inputNomor").addEventListener("input", function() {
            var sekarang = parseInt(document.getElementById("nomor").innerText) || 0;
            var saya = parseInt(this.value) || 0;

            // Jika pelanggan nekat mengetik angka yang sama atau di bawah nomor sekarang
            if (saya > 0 && saya <= sekarang) {
                this.value = ""; // Langsung hapus paksa jalurnya
                tampilkanPesanError(sekarang);
            } else {
                hitungEstimasi(sekarang, saya);
            }
        });

        // Fungsi menampilkan pesan penolakan yang dinamis
        function tampilkanPesanError(sekarang) {
            var infoEstimasi = document.getElementById("estimasi");
            var batasAman = sekarang + 1;
            infoEstimasi.innerText = "INPUT DITOLAK! Silakan masukkan nomor minimal " + batasAman;
            infoEstimasi.style.color = "#e74c3c";
        }

        // 3. Fungsi Logika Perhitungan Waktu Estimasi
        function hitungEstimasi(sekarang, saya) {
            var infoEstimasi = document.getElementById("estimasi");
            if (!saya || saya <= sekarang) {
                infoEstimasi.innerText = "--";
                infoEstimasi.style.color = "#7f8c8d";
                return;
            }

            var sisa = saya - sekarang;
            var menit = sisa * 5; 
            infoEstimasi.innerText = menit + " menit lagi (" + sisa + " antrian di depan Anda)";
            infoEstimasi.style.color = "#27ae60";
        }
    </script>
</body>
</html>
