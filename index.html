<!DOCTYPE html>
<html>
<head>
    <title>Antrian Smart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; position: relative; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        #nomor { font-size: 80px; color: #e74c3c; margin: 5px 0; font-weight: bold; }
        .info { font-size: 16px; color: #7f8c8d; margin: 10px 0; }
        #estimasi { font-weight: bold; color: #27ae60; font-size: 18px; }
        
        /* Indikator Server Modern */
        .status-server { font-size: 12px; color: #27ae60; font-weight: bold; margin-bottom: 15px; display: inline-block; background: #e8f8f0; padding: 5px 10px; border-radius: 20px; }
        .status-dot { height: 8px; width: 8px; background-color: #27ae60; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Style Tombol Ambil Antrian Otomatis */
        .btn-ambil { background: #3498db; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; max-width: 250px; margin-top: 10px; transition: 0.2s; }
        .btn-ambil:hover { background: #2980b9; }
        .btn-ambil:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        .box-tiket { background: #e8f4f8; padding: 15px; border-radius: 10px; margin-top: 15px; border: 2px dashed #3498db; }
        #nomorSayaTeks { font-size: 32px; color: #2c3e50; font-weight: bold; margin: 5px 0; }

        /* Animasi Berkedip Saat Nomor Dipanggil */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .panggil-sekarang { animation: blink 1s linear infinite; font-size: 20px !important; }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-server"><span class="status-dot"></span>SISTEM ONLINE</div>
        <h1>NOMOR SEDANG DILAYANI</h1>
        <div id="nomor">0</div>
        
        <hr style="border: 1px dashed #eee; margin: 15px 0;">
        
        <p class="info">Klik tombol di bawah untuk mengambil nomor antrian Anda:</p>
        <button id="btnAmbilAntrian" class="btn-ambil">AMBIL NOMOR</button>
        
        <div id="boxTiket" class="box-tiket" style="display: none;">
            <p class="info" style="margin:0; color:#3498db; font-weight:bold;">TIKET ANTRIAN ANDA</p>
            <div id="nomorSayaTeks">0</div>
            <p class="info" style="margin:0;">Estimasi Tunggu:<br><span id="estimasi">--</span></p>
        </div>
    </div>

    <script>
        // --- KONFIGURASI FIREBASE ---
        var firebaseConfig = {

            authDomain: "antriansmart.firebaseapp.com",
            databaseURL: "https://antriansmart-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antriansmart",
        };
        firebase.initializeApp(firebaseConfig);

        var db = firebase.database();
        var antrianTerakhirGlobal = 0;
        var nomorLokalSaya = localStorage.getItem("nomor_tiket_saya") || 0; 
        var pertamaKaliLoad = true;

        if (nomorLokalSaya > 0) {
            tampilkanTiketSaya(nomorLokalSaya);
        }

        // 1. Memantau panggilan_sekarang (Trigger Suara Panggilan)
        db.ref("/panggilan_sekarang").on("value", function(snapshot) {
            var sekarang = parseInt(snapshot.val()) || 0;
            document.getElementById("nomor").innerText = sekarang;

            // Logika Suara: Hanya berbunyi jika alat mengubah data, bukan saat web baru pertama dibuka
            if (!pertamaKaliLoad && sekarang > 0) {
                panggilSuaraOtomatis(sekarang);
            }
            pertamaKaliLoad = false;

            if (nomorLokalSaya > 0) {
                hitungEstimasiWaktu(sekarang, nomorLokalSaya);
            }
        });

        // 2. Memantau antrian_terakhir (Logika Auto-Reset)
        db.ref("/antrian_terakhir").on("value", function(snapshot) {
            antrianTerakhirGlobal = parseInt(snapshot.val()) || 0;
            
            // Jika alat dimatikan-nyalakan, Firebase menjadi 0, maka HP pelanggan ikut ter-reset otomatis
            if (antrianTerakhirGlobal === 0) {
                nomorLokalSaya = 0;
                localStorage.removeItem("nomor_tiket_saya");
                sembunyikanTiketDanAktifkanTombol();
            }
        });

        // 3. Logika Ambil Nomor + Pancing Suara Otomatis
        document.getElementById("btnAmbilAntrian").addEventListener("click", function() {
            // Memancing audio context agar diizinkan oleh browser Chrome/Safari
            pancingIzinAudio();

            var nomorBaru = antrianTerakhirGlobal + 1;
            db.ref("/antrian_terakhir").set(nomorBaru);
            
            nomorLokalSaya = nomorBaru;
            localStorage.setItem("nomor_tiket_saya", nomorLokalSaya);
            
            tampilkanTiketSaya(nomorBaru);
            
            var sekarang = parseInt(document.getElementById("nomor").innerText) || 0;
            hitungEstimasiWaktu(sekarang, nomorBaru);
        });
